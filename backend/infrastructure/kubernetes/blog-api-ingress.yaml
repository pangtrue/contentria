apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: blog-api-ingress
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    # No sticky session: the API is stateless and protects refresh-token
    # rotation with a row-level pessimistic lock + grace cache, so requests
    # should be load-balanced round-robin across pods.
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - www.contentria.com
      secretName: contentria-tls-secret
  rules:
    - host: www.contentria.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: blog-api-service
                port:
                  number: 8080
