apiVersion: apps/v1
kind: Deployment
metadata:
  name: blog-frontend-deployment
  labels:
    app: blog-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blog-frontend
  template:
    metadata:
      labels:
        app: blog-frontend
    spec:
      containers:
        - name: blog-frontend
          image: contentria/blog-frontend:1.0
          imagePullPolicy: Always # 프로덕션 배포 시 Always 또는 IfNotPresent 권장
          ports:
            - containerPort: 3000

          envFrom:
            - configMapRef:
                name: blog-frontend-config

          # ----------------------------------------------------
          # 리소스 할당 (Next.js 빌드 및 런타임 메모리 고려)
          # ----------------------------------------------------
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"

          # ----------------------------------------------------
          # 프로브 설정 (Next.js 루트 경로 응답 확인)
          # ----------------------------------------------------
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 15